name: liberica-build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "liberica:${{ matrix.type }}-${{ matrix.version }}-${{ matrix.libc }}"
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    strategy:
      fail-fast: false
      matrix:
        type: [jre, jdk]
        version: [8, 11, 17, 21, 25, 27]
        libc: [glibc, musl]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Liberica/Dockerfile
          platforms: linux/amd64
          load: true
          tags: smoke-test:latest
          build-args: |
            GITHUB_USER=${{ github.repository_owner }}
            JAVA_TYPE=${{ matrix.type }}
            JAVA_VERSION=${{ matrix.version }}
            LIBC_TYPE=${{ matrix.libc }}

      - name: Smoke test
        run: bash tests/smoke.sh smoke-test:latest

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/liberica
          tags: ${{ matrix.type }}-${{ matrix.version }}-${{ matrix.libc }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Liberica/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_USER=${{ github.repository_owner }}
            JAVA_TYPE=${{ matrix.type }}
            JAVA_VERSION=${{ matrix.version }}
            LIBC_TYPE=${{ matrix.libc }}
